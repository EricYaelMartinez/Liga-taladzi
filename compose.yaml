name: liga-taladzi

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/liga-app-ready && php-fpm -t"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 10s
    networks:
      - liga_network

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - liga_network

  frontend:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    networks:
      - liga_network

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: liga_taladzi
      POSTGRES_USER: liga_user
      POSTGRES_PASSWORD: liga_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga_user -d liga_taladzi"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - liga_network

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - liga_network

volumes:
  postgres_data:
  redis_data:
  vendor_data:
  node_modules_data:

networks:
  liga_network:
    driver: bridge
